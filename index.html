<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>A2-C1 Vocab Master 1,000 Words</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; overflow-x: hidden; }
    
    .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: #1e293b; border-right: 1px solid #334155; z-index: 1000; transition: left 0.3s ease; display: flex; flex-direction: column; box-shadow: 5px 0 25px rgba(0,0,0,0.5); }
    .sidebar.open { left: 0; }
    .sidebar-header { padding: 20px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h3 { color: #38bdf8; font-size: 18px; }
    .close-btn { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
    .round-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .round-item { padding: 12px 16px; background: #334155; border-radius: 10px; color: #f8fafc; font-weight: 600; font-size: 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
    .round-item:hover, .round-item.active { background: #2563eb; }
    
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; display: none; backdrop-filter: blur(2px); }
    .overlay.show { display: block; }
    
    .app-card { background: #1e293b; width: 100%; max-width: 480px; border-radius: 20px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); border: 1px solid #334155; display: flex; flex-direction: column; gap: 16px; position: relative; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #94a3b8; }
    .menu-btn { background: #334155; border: none; color: white; padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 18px; }
    .round-badge { background: #3b82f6; color: white; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 12px; }
    
    .word-container { text-align: center; padding: 10px 0; }
    .target-word { font-size: 32px; font-weight: 800; color: #f1f5f9; letter-spacing: 0.5px; }
    .level-badge { display: inline-block; background: #0284c7; color: #ffffff; font-size: 12px; font-weight: bold; padding: 2px 8px; border-radius: 6px; margin-left: 8px; vertical-align: middle; }
    
    .options-grid { display: flex; flex-direction: column; gap: 12px; }
    .option-btn { background: #334155; color: #f8fafc; border: 2px solid transparent; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 600; text-align: left; cursor: pointer; transition: all 0.2s ease; width: 100%; line-height: 1.3; }
    .option-btn:active { transform: scale(0.98); }
    .option-btn.correct { background: #15803d !important; border-color: #22c55e !important; color: #ffffff !important; }
    .option-btn.wrong { background: #b91c1c !important; border-color: #ef4444 !important; color: #ffffff !important; }
    .option-btn.disabled { pointer-events: none; opacity: 0.6; }
    .option-btn.correct.disabled { opacity: 1; }
    
    .details-box { background: #0f172a; border-radius: 16px; padding: 18px; border: 1px solid #334155; display: none; flex-direction: column; gap: 10px; animation: fadeIn 0.3s ease; }
    .details-box.show { display: flex; }
    .highlight-meaning-box { background: rgba(56, 189, 248, 0.1); border-left: 4px solid #38bdf8; padding: 10px 14px; border-radius: 8px; margin-bottom: 4px; }
    .highlight-meaning-title { font-size: 12px; color: #38bdf8; text-transform: uppercase; font-weight: bold; }
    .highlight-meaning-text { font-size: 22px; font-weight: 800; color: #4ade80; margin-top: 2px; line-height: 1.3; }
    .detail-row { font-size: 15px; line-height: 1.5; color: #cbd5e1; }
    .detail-title { color: #94a3b8; font-weight: 600; margin-right: 6px; }
    
    .next-btn { background: #2563eb; color: white; border: none; padding: 16px; border-radius: 14px; font-size: 18px; font-weight: bold; cursor: pointer; display: none; text-align: center; margin-top: 8px; }
    .next-btn.show { display: block; }
    
    .summary-box { display: none; flex-direction: column; align-items: center; text-align: center; gap: 15px; padding: 20px 0; }
    .summary-box.show { display: flex; }
    .summary-title { font-size: 24px; font-weight: bold; color: #38bdf8; }
    .summary-score { font-size: 48px; font-weight: 800; color: #22c55e; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>เลือกรอบการเล่น (1-50)</h3>
    <button class="close-btn" onclick="toggleMenu()">✕</button>
  </div>
  <div class="round-list" id="round-list"></div>
</div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div class="app-card">
  <div class="top-bar">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <span class="round-badge" id="round-badge">รอบที่ 1</span>
    <span>ข้อที่: <strong id="progress-val" style="color:#38bdf8">1/20</strong></span>
    <span>คะแนน: <strong id="score-val" style="color:#22c55e">0</strong></span>
  </div>

  <div id="quiz-view" style="display: flex; flex-direction: column; gap: 16px;">
    <div class="word-container">
      <span class="target-word" id="target-word">Loading...</span>
      <span class="level-badge" id="level-badge">A2</span>
    </div>

    <div class="options-grid" id="options-grid"></div>

    <div class="details-box" id="details-box">
      <div class="highlight-meaning-box">
        <div class="highlight-meaning-title">💡 คำแปลภาษาไทย</div>
        <div class="highlight-meaning-text" id="info-meaning">-</div>
      </div>
      <div class="detail-row"><span class="detail-title">Part of Speech:</span> <strong id="info-pos" style="color:#f1f5f9">-</strong></div>
      <div class="detail-row"><span class="detail-title">คำเหมือน (Synonym):</span> <span id="info-synonym" style="color:#38bdf8; font-weight:600;">-</span></div>
    </div>

    <button class="next-btn" id="next-btn" onclick="nextQuestion()">ข้อถัดไป ➡️</button>
  </div>

  <div class="summary-box" id="summary-view">
    <div class="summary-title">🎉 จบรอบการเล่น!</div>
    <p>คะแนนที่คุณทำได้ในรอบนี้</p>
    <div class="summary-score" id="final-score">0 / 20</div>
    <button class="next-btn show" style="width:100%" onclick="playNextRound()">เล่นรอบถัดไป ➡️</button>
    <button class="option-btn" style="text-align:center; margin-top:10px" onclick="replayCurrentRound()">🔄 เล่นรอบนี้ใหม่อีกครั้ง</button>
  </div>
</div>

  const vocabDatabase = rawList.map(item => {
    const word = item[0];
    const pos = item[1];
    const level = item[2];
    const dictInfo = dict[word] || ["ความหมายตามบริบท", "related, similar"];
    return { word, pos, level, meaning: dictInfo[0], synonym: dictInfo[1] };
  });

  const WORDS_PER_ROUND = 20;
  let currentRound = 1;
  let roundWords = [];
  let currentQuestionIndex = 0;
  let score = 0;
  let currentVocab = null;

  function toggleMenu() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  }

  function buildRoundMenu() {
    const list = document.getElementById('round-list');
    list.innerHTML = '';
    const totalRounds = Math.ceil(vocabDatabase.length / WORDS_PER_ROUND);
    for (let i = 1; i <= totalRounds; i++) {
      const item = document.createElement('div');
      item.className = `round-item ${i === currentRound ? 'active' : ''}`;
      item.innerHTML = `<span>รอบที่ ${i} (${(i-1)*20 + 1}-${Math.min(i*20, vocabDatabase.length)})</span><small style="color:#38bdf8">พร้อม</small>`;
      item.onclick = () => selectRound(i);
      list.appendChild(item);
    }
  }

  function selectRound(roundNum) {
    currentRound = roundNum;
    toggleMenu();
    startRound();
  }

  function startRound() {
    document.getElementById('quiz-view').style.display = 'flex';
    document.getElementById('summary-view').classList.remove('show');
    document.getElementById('round-badge').textContent = `รอบที่ ${currentRound}`;
    
    const startIndex = (currentRound - 1) * WORDS_PER_ROUND;
    roundWords = vocabDatabase.slice(startIndex, startIndex + WORDS_PER_ROUND);

    currentQuestionIndex = 0;
    score = 0;
    
    buildRoundMenu();
    loadQuestion();
  }

  function loadQuestion() {
    document.getElementById('details-box').classList.remove('show');
    document.getElementById('next-btn').classList.remove('show');
    
    currentVocab = roundWords[currentQuestionIndex];

    document.getElementById('progress-val').textContent = `${currentQuestionIndex + 1}/${roundWords.length}`;
    document.getElementById('score-val').textContent = score;
    document.getElementById('target-word').textContent = currentVocab.word;
    document.getElementById('level-badge').textContent = currentVocab.level;

    const options = generateUniqueOptions(currentVocab);
    const optionsContainer = document.getElementById('options-grid');
    optionsContainer.innerHTML = '';

    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt.text;
      btn.onclick = () => checkAnswer(btn, opt.isCorrect);
      optionsContainer.appendChild(btn);
    });
  }

  function generateUniqueOptions(correctItem) {
    let choices = [{ text: correctItem.meaning, isCorrect: true }];
    let otherMeanings = Array.from(new Set(
      vocabDatabase
        .filter(item => item.meaning !== correctItem.meaning)
        .map(item => item.meaning)
    ));
    
    otherMeanings = shuffleArray(otherMeanings).slice(0, 3);
    otherMeanings.forEach(meaning => {
      choices.push({ text: meaning, isCorrect: false });
    });

    return shuffleArray(choices);
  }

  function checkAnswer(selectedBtn, isCorrect) {
    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(btn => {
      btn.classList.add('disabled');
      if (btn.textContent === currentVocab.meaning) {
        btn.classList.add('correct');
      }
    });

    if (isCorrect) {
      score++;
      document.getElementById('score-val').textContent = score;
    } else {
      selectedBtn.classList.add('wrong');
    }

    showDetails();

    const nextBtn = document.getElementById('next-btn');
    nextBtn.textContent = (currentQuestionIndex + 1 >= roundWords.length) ? 'ดูผลคะแนนประจำรอบ 🏁' : 'ข้อถัดไป ➡️';
    nextBtn.classList.add('show');
  }

  function showDetails() {
    document.getElementById('info-meaning').textContent = currentVocab.meaning;
    document.getElementById('info-pos').textContent = currentVocab.pos;
    document.getElementById('info-synonym').textContent = currentVocab.synonym;
    document.getElementById('details-box').classList.add('show');
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < roundWords.length) {
      loadQuestion();
    } else {
      showRoundSummary();
    }
  }

  function showRoundSummary() {
    document.getElementById('quiz-view').style.display = 'none';
    document.getElementById('final-score').textContent = `${score} / ${roundWords.length}`;
    document.getElementById('summary-view').classList.add('show');
  }

  function playNextRound() {
    const totalRounds = Math.ceil(vocabDatabase.length / WORDS_PER_ROUND);
    currentRound = (currentRound < totalRounds) ? currentRound + 1 : 1;
    startRound();
  }

  function replayCurrentRound() {
    startRound();
  }

  function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  window.onload = function() {
    startRound();
  };
